services:
  # Backend Service
  - type: web
    name: planetwars-backend
    runtime: docker
    repo: https://github.com/TimBeckerAachen/planet_wars
    branch: main
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: planetwars-db
          property: connectionString
      - key: PORT
        value: 8000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRATION_DAYS
        value: 7
    healthCheckPath: /health
    autoDeploy: false

  # Frontend Service
  - type: web
    name: planetwars-frontend
    runtime: docker
    repo: https://github.com/TimBeckerAachen/planet_wars
    branch: main
    rootDir: frontend
    plan: free
    envVars:

      - key: BACKEND_HOST
        value: planetwars-backend.onrender.com
      - key: BACKEND_PORT
        value: 443
      - key: BACKEND_SCHEME
        value: https

    autoDeploy: false

databases:
  - name: planetwars-db
    databaseName: planetwars
    user: planetwars_user
    plan: free
