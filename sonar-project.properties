sonar.projectKey=planet_wars_combined
sonar.projectName=Planet Wars

# --- MULTI-LANGUAGE SOURCE SCANNING ---
# Comma-separated paths to source directories
sonar.sources=backend,frontend/src
sonar.tests=backend/tests

# --- EXCLUSIONS ---
# Global exclusions
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/__pycache__/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/coverage/**

# --- PYTHON SPECIFIC ---
sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- JAVASCRIPT/TYPESCRIPT SPECIFIC ---
# Create LCOV report via 'npm run test:coverage' (setup required in package.json)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
