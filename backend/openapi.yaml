openapi: 3.1.0
info:
  title: Planet Wars API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /:
    get:
      summary: Read Root
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/signup:
    post:
      summary: Signup
      description: Register a new user and assign a planet.
      operationId: signup_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /game/state:
    get:
      summary: Get Game State
      description: 'Get current game state: user resources, planet, buildings, units.

        Triggers resource update.'
      operationId: get_game_state_game_state_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
      security:
      - HTTPBearer: []
  /game/build:
    post:
      summary: Build Building
      description: 'Start construction of a building.

        Costs 50 gold, takes 2 hours.'
      operationId: build_building_game_build_post
      security:
      - HTTPBearer: []
      parameters:
      - name: building_name
        in: query
        required: true
        schema:
          type: string
          title: Building Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /game/map:
    get:
      summary: Get Map
      operationId: get_map_game_map_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapStateResponse'
      security:
      - HTTPBearer: []
  /game/planet/rename:
    patch:
      summary: Rename Planet
      description: Rename the user's planet. Name must be unique.
      operationId: rename_planet_game_planet_rename_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanetRenameRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanetResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /auth/login:
    post:
      summary: Login
      description: 'Authenticate a user and return JWT token


        - **identifier**: Username or email

        - **password**: User password


        Returns JWT access token and user data'
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      summary: Get Current User Info
      description: 'Get current authenticated user information


        Requires valid JWT token in Authorization header'
      operationId: get_current_user_info_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /game/building/{building_id}:
    get:
      summary: Get Building Details
      operationId: get_building_details_game_building__building_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: building_id
        in: path
        required: true
        schema:
          type: integer
          title: Building Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingDetailsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /game/produce:
    post:
      summary: Produce Unit
      operationId: produce_unit_game_produce_post
      security:
      - HTTPBearer: []
      parameters:
      - name: building_id
        in: query
        required: true
        schema:
          type: integer
          title: Building Id
      - name: unit_name
        in: query
        required: true
        schema:
          type: string
          title: Unit Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /game/fleet/send:
    post:
      summary: Send Fleet
      description: 'Send a fleet on a mission (attack or transport).


        - **target_planet_id**: ID of the destination planet

        - **mission_type**: ''attack'' or ''transport''

        - **ship_count**: Number of spaceships to send

        - **gold_amount**: Amount of gold to transport (transport only, max 10 per
        ship)'
      operationId: send_fleet_game_fleet_send_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetSendRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetMissionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /game/fleet/missions:
    get:
      summary: Get Fleet Missions
      description: 'Get all active fleet missions for the current user.

        Returns both outgoing (owned by user) and incoming (targeting user''s planet).'
      operationId: get_fleet_missions_game_fleet_missions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetMissionsListResponse'
      security:
      - HTTPBearer: []
  /game/messages:
    get:
      summary: Get Messages
      description: Get all messages for the current user, ordered by most recent first.
      operationId: get_messages_game_messages_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
      security:
      - HTTPBearer: []
  /game/messages/{message_id}/read:
    patch:
      summary: Mark Message Read
      description: Mark a message as read.
      operationId: mark_message_read_game_messages__message_id__read_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          title: Message Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuthResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          $ref: '#/components/schemas/UserResponse'
      type: object
      required:
      - access_token
      - user
      title: AuthResponse
      description: Schema for authentication response with JWT token
    BuildingDetailsResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        level:
          type: integer
          title: Level
        is_constructing:
          type: boolean
          title: Is Constructing
        finish_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finish Time
        production_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Production Type
        production_finish_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Production Finish Time
        upgrade_cost:
          anyOf:
          - type: integer
          - type: 'null'
          title: Upgrade Cost
        upgrade_duration:
          anyOf:
          - type: integer
          - type: 'null'
          title: Upgrade Duration
        production_options:
          items:
            $ref: '#/components/schemas/ProductionOption'
          type: array
          title: Production Options
          default: []
        current_production_speed_bonus:
          anyOf:
          - type: number
          - type: 'null'
          title: Current Production Speed Bonus
        next_level_production_speed_bonus:
          anyOf:
          - type: number
          - type: 'null'
          title: Next Level Production Speed Bonus
      type: object
      required:
      - id
      - name
      - level
      - is_constructing
      title: BuildingDetailsResponse
      description: Deep details for single building view
    BuildingResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        level:
          type: integer
          title: Level
        is_constructing:
          type: boolean
          title: Is Constructing
        finish_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Finish Time
        production_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Production Type
        production_finish_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Production Finish Time
      type: object
      required:
      - id
      - name
      - level
      - is_constructing
      title: BuildingResponse
    ConstructionOption:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          title: Type
        cost:
          type: integer
          title: Cost
        duration:
          type: integer
          title: Duration
        production:
          type: integer
          title: Production
        level:
          type: integer
          title: Level
      type: object
      required:
      - name
      - type
      - cost
      - duration
      - production
      - level
      title: ConstructionOption
    FleetMissionResponse:
      properties:
        id:
          type: integer
          title: Id
        source_planet_id:
          type: integer
          title: Source Planet Id
        target_planet_id:
          type: integer
          title: Target Planet Id
        source_planet_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Planet Name
        target_planet_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Planet Name
        mission_type:
          type: string
          title: Mission Type
        ship_count:
          type: integer
          title: Ship Count
        gold_carried:
          type: integer
          title: Gold Carried
        departure_time:
          type: string
          format: date-time
          title: Departure Time
        arrival_time:
          type: string
          format: date-time
          title: Arrival Time
        return_time:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Return Time
        status:
          type: string
          title: Status
        owner_id:
          type: integer
          title: Owner Id
      type: object
      required:
      - id
      - source_planet_id
      - target_planet_id
      - mission_type
      - ship_count
      - gold_carried
      - departure_time
      - arrival_time
      - status
      - owner_id
      title: FleetMissionResponse
      description: Response for a fleet mission
    FleetMissionsListResponse:
      properties:
        outgoing:
          items:
            $ref: '#/components/schemas/FleetMissionResponse'
          type: array
          title: Outgoing
          default: []
        incoming:
          items:
            $ref: '#/components/schemas/IncomingFleetResponse'
          type: array
          title: Incoming
          default: []
      type: object
      title: FleetMissionsListResponse
      description: List of fleet missions
    FleetSendRequest:
      properties:
        target_planet_id:
          type: integer
          title: Target Planet Id
          description: ID of the target planet
        mission_type:
          type: string
          title: Mission Type
          description: '''attack'' or ''transport'''
        ship_count:
          type: integer
          exclusiveMinimum: 0.0
          title: Ship Count
          description: Number of ships to send
        gold_amount:
          type: integer
          minimum: 0.0
          title: Gold Amount
          description: Gold to transport (transport only)
          default: 0
      type: object
      required:
      - target_planet_id
      - mission_type
      - ship_count
      title: FleetSendRequest
      description: Request to send a fleet on a mission
    GameStateResponse:
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        planet:
          $ref: '#/components/schemas/PlanetResponse'
        buildings:
          items:
            $ref: '#/components/schemas/BuildingResponse'
          type: array
          title: Buildings
        units:
          items:
            $ref: '#/components/schemas/UnitResponse'
          type: array
          title: Units
        construction_options:
          items:
            $ref: '#/components/schemas/ConstructionOption'
          type: array
          title: Construction Options
          default: []
      type: object
      required:
      - user
      - planet
      - buildings
      - units
      title: GameStateResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IncomingFleetResponse:
      properties:
        id:
          type: integer
          title: Id
        source_planet_name:
          type: string
          title: Source Planet Name
        source_owner_username:
          type: string
          title: Source Owner Username
        ship_count:
          type: integer
          title: Ship Count
        mission_type:
          type: string
          title: Mission Type
        arrival_time:
          type: string
          format: date-time
          title: Arrival Time
      type: object
      required:
      - id
      - source_planet_name
      - source_owner_username
      - ship_count
      - mission_type
      - arrival_time
      title: IncomingFleetResponse
      description: Information about an incoming fleet
    MapStateResponse:
      properties:
        planets:
          items:
            $ref: '#/components/schemas/PlanetResponse'
          type: array
          title: Planets
      type: object
      required:
      - planets
      title: MapStateResponse
    MessageListResponse:
      properties:
        messages:
          items:
            $ref: '#/components/schemas/MessageResponse'
          type: array
          title: Messages
        unread_count:
          type: integer
          title: Unread Count
      type: object
      required:
      - messages
      - unread_count
      title: MessageListResponse
      description: List of messages
    MessageResponse:
      properties:
        id:
          type: integer
          title: Id
        subject:
          type: string
          title: Subject
        body:
          type: string
          title: Body
        is_read:
          type: boolean
          title: Is Read
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - subject
      - body
      - is_read
      - created_at
      title: MessageResponse
      description: Response for a single message
    PlanetRenameRequest:
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 3
          title: Name
          description: New planet name
      type: object
      required:
      - name
      title: PlanetRenameRequest
    PlanetResponse:
      properties:
        id:
          type: integer
          title: Id
        x:
          type: integer
          title: X
        y:
          type: integer
          title: Y
        name:
          type: string
          title: Name
        owner_id:
          type: integer
          title: Owner Id
        owner_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Username
      type: object
      required:
      - id
      - x
      - y
      - name
      - owner_id
      title: PlanetResponse
    ProductionOption:
      properties:
        name:
          type: string
          title: Name
        cost:
          additionalProperties:
            type: integer
          type: object
          title: Cost
        duration:
          type: integer
          title: Duration
        base_time:
          type: integer
          title: Base Time
      type: object
      required:
      - name
      - cost
      - duration
      - base_time
      title: ProductionOption
    UnitResponse:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        count:
          type: integer
          title: Count
      type: object
      required:
      - id
      - name
      - count
      title: UnitResponse
    UserLoginRequest:
      properties:
        identifier:
          type: string
          title: Identifier
          description: Username or email
        password:
          type: string
          title: Password
          description: User password
      type: object
      required:
      - identifier
      - password
      title: UserLoginRequest
      description: Schema for user login request
    UserResponse:
      properties:
        id:
          type: integer
          title: Id
        username:
          type: string
          title: Username
        email:
          type: string
          title: Email
        gold:
          type: integer
          title: Gold
          default: 100
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - username
      - email
      - created_at
      - updated_at
      title: UserResponse
      description: Schema for user data response (excludes password)
    UserSignupRequest:
      properties:
        username:
          type: string
          maxLength: 50
          minLength: 3
          title: Username
          description: Unique username
        email:
          type: string
          format: email
          title: Email
          description: Valid email address
        password:
          type: string
          maxLength: 100
          minLength: 8
          title: Password
          description: Password (min 8 characters)
      type: object
      required:
      - username
      - email
      - password
      title: UserSignupRequest
      description: Schema for user registration request
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
