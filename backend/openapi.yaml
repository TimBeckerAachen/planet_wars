openapi: 3.0.3
info:
  title: Planet Wars API
  description: Authentication API for Planet Wars browser game
  version: 1.0.0

servers:
  - url: /api
    description: Production API

tags:
  - name: auth
    description: Authentication endpoints
  - name: game
    description: Game logic endpoints
  - name: health
    description: Health check endpoints

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication token

  schemas:
    UserSignupRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
          description: Unique username (alphanumeric, underscores, hyphens allowed)
          example: player123
        email:
          type: string
          format: email
          description: Valid email address
          example: player@example.com
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Password (minimum 8 characters)
          example: securepass123

    UserLoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: Username or email address
          example: player123
        password:
          type: string
          description: User password
          example: securepass123

    User:
      type: object
      properties:
        id:
          type: integer
          description: User ID
          example: 1
        username:
          type: string
          description: Username
          example: player123
        email:
          type: string
          format: email
          description: Email address
          example: player@example.com
        gold:
          type: integer
          description: Current gold resources
          example: 100
        created_at:
          type: string
          format: date-time
          description: Account creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp


    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          description: Token type
          example: bearer
        user:
          $ref: '#/components/schemas/User'

    Error:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: Invalid credentials

    PlanetResponse:
      type: object
      properties:
        id:
          type: integer
        x:
          type: integer
        y:
          type: integer
        name:
          type: string
        owner_id:
          type: integer

    BuildingResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        level:
          type: integer
        is_constructing:
          type: boolean
        finish_time:
          type: string
          format: date-time
          nullable: true

    UnitResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        count:
          type: integer

    GameStateResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        planet:
          $ref: '#/components/schemas/PlanetResponse'
        buildings:
          type: array
          items:
            $ref: '#/components/schemas/BuildingResponse'
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitResponse'

    MapStateResponse:
      type: object
      properties:
        planets:
          type: array
          items:
            $ref: '#/components/schemas/PlanetResponse'

    ConstructionResponse:
      type: object
      properties:
        status:
          type: string
        finish_time:
          type: string
          format: date-time


paths:
  /health:
    get:
      tags:
        - health
      summary: Health check
      description: Check if the API is running
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy

  /:
    get:
      tags:
        - health
      summary: Root endpoint
      description: Returns API welcome message
      responses:
        '200':
          description: Welcome message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello from Planet Wars API!

  /auth/signup:
    post:
      tags:
        - auth
      summary: Register a new user
      description: Create a new user account and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Username or email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                duplicate_username:
                  value:
                    detail: Username already registered
                duplicate_email:
                  value:
                    detail: Email already registered
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - auth
      summary: Log in a user
      description: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Invalid credentials

  /auth/me:
    get:
      tags:
        - auth
      summary: Get current user
      description: Retrieve current authenticated user information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: Could not validate credentials
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                detail: User not found

  /game/state:
    get:
      tags:
        - game
      summary: Get game state
      description: Retrieve current game state including resources, buildings, and units
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStateResponse'
  
  /game/build:
    post:
      tags:
        - game
      summary: Construct building
      description: Start construction or upgrade of a building
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: building_name
          schema:
            type: string
          required: true
          description: Name of the building (gold_mine, space_ship_factory, university)
      responses:
        '200':
          description: Construction started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionResponse'
        '400':
          description: Invalid building or insufficient resources
  
  /game/map:
    get:
      tags:
        - game
      summary: Get map
      description: Retrieve the galaxy map
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Map state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapStateResponse'

