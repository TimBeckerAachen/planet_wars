server {
    listen ${PORT};
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend

    location /api/ {
        # Use Docker's internal DNS resolver to handle dynamic upstreams
        resolver ${RESOLVER} valid=30s;
        # Use https when connecting to external Render URL, http for internal
        set $backend_scheme "https";
        set $upstream_app $backend_scheme://${BACKEND_HOST}:${BACKEND_PORT};

        proxy_pass $upstream_app;
        
        # SSL configuration for HTTPS upstream
        proxy_ssl_server_name on;
        proxy_ssl_name ${BACKEND_HOST};
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Rewrite URL if necessary
        rewrite ^/api/(.*) /$1 break;
    }
}
